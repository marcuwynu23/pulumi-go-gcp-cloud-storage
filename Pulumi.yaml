name: pulumi-go-gcp-cloud-storage
description: A minimal Google Cloud Go Pulumi program
runtime: go
config:
  pulumi:tags:
    value:
      pulumi:template: gcp-go
  gcp:project:
    description: The Google Cloud project to deploy into
  gcp:region:
    description: The GCP region for the bucket
    default: US
  storage:bucketName:
    description: The name of the storage bucket
    default: my-pulumi-bucket
  storage:location:
    description: The location of the bucket
    default: US
  storage:storageClass:
    description: The storage class of the bucket
    default: STANDARD
  storage:versioning:
    description: Whether to enable versioning
    default: "true"
  storage:uniformBucketLevelAccess:
    description: Whether to enable uniform bucket level access
    default: "true"